<!-- role-selection.component.html -->
<div class="role-selection-container">
  <header class="top-bar">

  </header>

  <main class="role-content">
    <section class="role-info">
      <h1>Empre-GO!</h1>
      <p>
        A solução ideal para a busca e solicitação de serviços baseados na sua
        localização.
      </p>
    </section>

    <section class="role-actions">
      <div class="role-icon">
        <mat-icon class="role-icon-large">location_on</mat-icon>
      </div>
    <button class="register-btn" (click)="goToRegister()">
      Novo por aqui? Faça o seu cadastro
    </button>
      <button class="role-btn" (click)="selectRole('empregador')">
        Ja tem uma conta? Faça login 
      </button>
    </section>
  </main>
</div>
